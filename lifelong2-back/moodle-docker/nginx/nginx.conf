# ================================================================
# LLL + Moodle — Nginx Reverse Proxy
#
# Routes:
#   http://lll.localhost/        → LLL Frontend (Quasar)
#   http://lll.localhost/api/    → LLL Backend  (NestJS)
#   http://moodle.localhost/     → Moodle (styled to match LLL)
#
# Local dev setup (add to C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1  lll.localhost
#   127.0.0.1  moodle.localhost
#
# Production: replace localhost hostnames with real domain names.
# ================================================================

upstream lll_frontend {
    server host.docker.internal:9000;  # Quasar dev server running on host
}

upstream lll_backend {
    server host.docker.internal:3000;  # NestJS running on host
}

upstream moodle_app {
    server moodle:8080;                # Moodle container (same Docker network)
}

# ── LLL App ──────────────────────────────────────────────────────────────────
server {
    listen      80;
    server_name lll.localhost localhost;

    client_max_body_size 50M;

    # NestJS API
    location /api/ {
        proxy_pass         http://lll_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Quasar Frontend (dev HMR WebSocket support)
    location / {
        proxy_pass         http://lll_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}

# ── Moodle (themed as LLL) ───────────────────────────────────────────────────
server {
    listen      80;
    server_name moodle.localhost;

    client_max_body_size 200M;

    location / {
        proxy_pass         http://moodle_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # Required for Moodle session cookies
        proxy_cookie_domain moodle:8080 moodle.localhost;
        proxy_cookie_path   /           /;

        # Timeouts for long Moodle operations
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}

# =============================================================================
# LLL Platform — Single Docker Compose
# รัน:  docker compose up -d
# หยุด: docker compose down
# Purge Moodle cache: docker exec moodle_web php admin/cli/purge_caches.php
# =============================================================================

services:
  # ============================================================
  # BACKEND DATABASE (NestJS)
  # Adminer → http://localhost:8081
  # ============================================================
  db:
    image: mariadb:10.6
    container_name: lll_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-lifelong2}
      MYSQL_USER: ${DB_USER:-lifelong2}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: lll_adminer
    restart: always
    ports:
      - '8081:8080'
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # MOODLE DATABASE (port 3307 เพื่อไม่ชนกับ Backend DB)
  # phpMyAdmin → http://localhost:8888
  # ============================================================
  moodle_mariadb:
    image: public.ecr.aws/bitnami/mariadb:10.11
    container_name: moodle_mariadb
    restart: always
    environment:
      - MARIADB_USER=bn_moodle
      - MARIADB_PASSWORD=${MOODLE_DB_PASSWORD:-moodle_password}
      - MARIADB_DATABASE=LLLv.2
      - MARIADB_ROOT_PASSWORD=${MOODLE_DB_PASSWORD:-moodle_password}
    ports:
      - '3307:3306'
    volumes:
      - moodle_mariadb_data:/bitnami/mariadb
      - ./lifelong2-back/moodle_seed.sql:/docker-entrypoint-initdb.d/moodle_seed.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: moodle_pma
    restart: always
    ports:
      - '8888:80'
    environment:
      - PMA_HOST=moodle_mariadb
    depends_on:
      moodle_mariadb:
        condition: service_healthy

  # ============================================================
  # MOODLE LMS
  # Direct  → http://localhost:8080
  # Via Nginx → http://moodle.localhost
  # ============================================================
  moodle:
    image: public.ecr.aws/bitnami/moodle:5.2
    container_name: moodle_web
    restart: always
    user: root
    entrypoint:
      - /bin/bash
      - -ec
      - |
        chown -R daemon:root /bitnami/moodle_data || true
        chmod -R 775 /bitnami/moodle_data || true
        sed -i 's/--chmod=2775/--chmod=0777/' /opt/bitnami/scripts/libmoodle.sh
        mkdir -p /opt/bitnami/apache/conf/bitnami/certs
        if [ ! -s /opt/bitnami/apache/conf/bitnami/certs/tls.crt ]; then openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 -subj "/CN=example.com" -keyout /opt/bitnami/apache/conf/bitnami/certs/tls.key -out /opt/bitnami/apache/conf/bitnami/certs/tls.crt; fi
        cp /moodle-config-src.php /opt/bitnami/moodle/config.php
        rm -rf /opt/bitnami/moodle/public/auth/userkey
        cp -a /moodle-auth-userkey-src /opt/bitnami/moodle/public/auth/userkey
        mkdir -p /opt/bitnami/moodle/public/local
        rm -rf /opt/bitnami/moodle/public/local/wstools
        cp -a /moodle-local-wstools-src /opt/bitnami/moodle/public/local/wstools
        rm -rf /opt/bitnami/moodle/public/local/usertoken
        cp -a /moodle-local-usertoken-src /opt/bitnami/moodle/public/local/usertoken
        rm -rf /opt/bitnami/moodle/public/theme/lll /opt/bitnami/moodle/public/theme/lifelong2
        if [ -f /moodle-theme-src/version.php ]; then cp -a /moodle-theme-src /opt/bitnami/moodle/public/theme/lifelong2; fi
        php /opt/bitnami/moodle/admin/cli/upgrade.php --non-interactive
        php /opt/bitnami/moodle/admin/cli/purge_caches.php
        exec /opt/bitnami/scripts/moodle/run.sh
    ports:
      - '8080:8080'
    environment:
      - MOODLE_DATABASE_HOST=moodle_mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=bn_moodle
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DB_PASSWORD:-moodle_password}
      - MOODLE_DATABASE_NAME=LLLv.2
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD:-Moodle123!}
      - MOODLE_EMAIL=admin@example.com
      - MOODLE_SITE_URL=http://localhost:8080
      - MOODLE_THEME=${MOODLE_THEME:-lifelong2}
      - MOODLE_REVERSEPROXY=false
      - MOODLE_SSLPROXY=false
      - MOODLE_SKIP_BOOTSTRAP=yes
    volumes:
      - moodle_data_persistence:/bitnami/moodle_data
      - ./lifelong2-back/moodle-config.php:/moodle-config-src.php:ro
      - ./lifelong2-back/moodle-auth_userkey:/moodle-auth-userkey-src:ro
      - ./lifelong2-back/moodle-local_wstools:/moodle-local-wstools-src:ro
      - ./lifelong2-back/moodle-local_usertoken:/moodle-local-usertoken-src:ro
      - ./lifelong2-back/moodle-theme:/moodle-theme-src:ro
    depends_on:
      moodle_mariadb:
        condition: service_healthy

  # ============================================================
  # NGINX REVERSE PROXY — port 80
  # ============================================================
volumes:
  db_data:
  moodle_mariadb_data:
    driver: local
  moodle_data_persistence:
    driver: local
